spring.application.name=gamestore
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gamestore}
spring.datasource.username=${DB_USER:gamestore}
spring.datasource.password=${DB_PASSWORD:gamestore}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=${PORT:8080}
springdoc.swagger-ui.path=/
