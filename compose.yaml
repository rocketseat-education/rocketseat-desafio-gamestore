services:
  postgres:
    container_name: gamestore-local-postgres
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gamestore
      POSTGRES_USER: gamestore
      POSTGRES_PASSWORD: gamestore
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamestore -d gamestore"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
